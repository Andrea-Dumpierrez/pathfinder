
name: CI Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  archetype:
    runs-on: ubuntu-22.04

    outputs:
      group: ${{ steps.maven-info.outputs.group }}
      artifact: ${{ steps.maven-info.outputs.artifact }}
      version: ${{ steps.maven-info.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify pom.xml
        run: |
          if [ ! -f pom.xml ]; then
            echo "ERROR: pom.xml not found"
            exit 1
          fi
          echo "pom.xml found"

      - name: Extract Maven coordinates
        id: maven-info
        run: |
          GROUP=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          echo "group=$GROUP" >> "$GITHUB_OUTPUT"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: archetype
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        java: ['21', '25']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show Maven project information
        run: |
          echo "Group: ${{ needs.archetype.outputs.group }}"
          echo "Artifact: ${{ needs.archetype.outputs.artifact }}"
          echo "Version: ${{ needs.archetype.outputs.version }}"
          echo "Java: ${{ matrix.java }}"

      - name: Build and run tests
        run: mvn -B clean compile test package verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: pathfinder-jar-java-${{ matrix.java }}
          path: target/*.jar
          if-no-files-found: error

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-java-${{ matrix.java }}
          path: target/site/jacoco/
          if-no-files-found: error

      - name: Main branch validation
        if: github.ref == 'refs/heads/master'
        run: echo "Validation on master branch"

  coverage-check:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report-java-21
          path: reports

      - name: Check coverage threshold
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("reports/jacoco.xml").getroot()

          counter = next(
              c for c in root.findall("counter")
              if c.attrib["type"] == "INSTRUCTION"
          )

          covered = int(counter.attrib["covered"])
          missed = int(counter.attrib["missed"])
          total = covered + missed

          if total == 0:
              raise SystemExit("No instructions found")

          coverage = covered / total * 100
          threshold = 95

          print(f"Coverage: {coverage:.2f}%")
          print(f"Required: {threshold}%")

          if coverage < threshold:
              raise SystemExit("Coverage below threshold")

          print("Coverage meets the threshold")
          PY
